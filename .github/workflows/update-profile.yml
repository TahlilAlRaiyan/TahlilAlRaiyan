name: Update profile widgets

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  cards:
    name: Stats and repo cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=TahlilAlRaiyan&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=TahlilAlRaiyan&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card - Bank GUI Loan System
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TahlilAlRaiyan&repo=Bank-GUI-Loan-System&theme=tokyonight&hide_border=true
          path: profile/pin-bank-gui-loan-system.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card - Smart Car Rental
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TahlilAlRaiyan&repo=Smart-Car-Rental-Management-System-Customer-Role&theme=tokyonight&hide_border=true
          path: profile/pin-smart-car-rental.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card - QR Code Generator
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TahlilAlRaiyan&repo=qr-code-generator-python&theme=tokyonight&hide_border=true
          path: profile/pin-qr-code-generator.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card - Tkinter Clock App
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TahlilAlRaiyan&repo=tkinter-clock-app-python&theme=tokyonight&hide_border=true
          path: profile/pin-tkinter-clock-app.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push

  snake:
    name: Contribution graph (snake)
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
